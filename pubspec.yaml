name: dony
description: "P2P marketplace connecting travelers and senders for package delivery to Africa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  cloud_firestore: ^5.6.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Messaging UI
  cached_network_image: ^3.4.1

  # Payments
  flutter_stripe: ^11.0.0

  # QR & Biometrics
  mobile_scanner: ^5.0.0
  local_auth: ^2.3.0

  # Location
  geolocator: ^13.0.0

  # Map
  google_maps_flutter: ^2.9.0

  # Media
  image_picker: ^1.1.0
  native_exif: ^0.7.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.0

  # State management
  flutter_bloc: ^8.1.6
  rxdart: ^0.28.0

  # Navigation
  go_router: ^14.0.0

  # Monitoring
  sentry_flutter: ^8.0.0

  # DI
  get_it: ^8.0.0

  # UI / Design
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  phosphor_flutter: ^2.1.0
  pinput: ^5.0.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1

  # WebView (Stripe Identity, KYC)
  webview_flutter: ^4.10.0

  # External browser (Stripe Connect onboarding)
  url_launcher: ^6.3.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Splash
  flutter_native_splash: ^2.4.3

  # Deep links
  app_links: ^6.3.4

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  share_plus: ^10.0.0
  uuid: ^4.4.0
  crypto: ^3.0.6
  path_provider: ^2.1.0
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.2
  flutter_skill: ^0.9.36

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.3
  flutter_launcher_icons: ^0.14.0
  flutter_skill: ^0.9.36

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon_source.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/app_icon_source.png"
  web:
    generate: true
    image_path: "assets/logos/app_icon_source.png"
    background_color: "#FFFFFF"
    theme_color: "#0B5FFF"

flutter_native_splash:
  color: "#FAFAF8"
  image: assets/mascotte/joyeux.png
  android_12:
    color: "#FAFAF8"
    icon_background_color: "#FAFAF8"
    image: assets/splash/joyeux_square.png
  ios: true
  android: true

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/logos/2.0x/
    - assets/logos/3.0x/
    - assets/mascotte/
