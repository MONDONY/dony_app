name: dony
description: "P2P marketplace connecting travelers and senders for package delivery to Africa."
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^4.0.0
  firebase_auth: ^6.0.0
  firebase_messaging: ^16.0.0
  cloud_firestore: ^6.0.0

  # Authentication
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.2

  # Messaging UI
  cached_network_image: ^3.4.1

  # Payments
  # 12.x : supporte le SceneDelegate Flutter (UIScene). En 11.x, presentPaymentSheet()
  # échouait silencieusement sur iOS car le rootViewController était introuvable
  # sous l'architecture UIScene (window nil).
  flutter_stripe: ^12.0.0

  # QR & Biometrics
  # 7.x : Apple Vision/AVFoundation sur iOS (plus de GoogleMLKit) → résout le conflit
  # GoogleDataTransport avec Firebase 11.15 (MLKit exigeait GDT <10, Firebase exige >=10).
  # Compatible iOS 12+ ; supporte aussi le simulateur Apple Silicon.
  mobile_scanner: ^7.2.0
  local_auth: ^2.3.0

  # Location
  geolocator: ^13.0.0
  geocoding: ^3.0.0

  # Map
  google_maps_flutter: ^2.9.0

  # Media
  image_picker: ^1.1.0
  native_exif: ^0.7.0
  flutter_image_compress: ^2.4.0

  # Contacts — picker natif OS (aucune permission READ_CONTACTS requise)
  flutter_native_contact_picker: ^0.0.12

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.0

  # State management
  flutter_bloc: ^8.1.6
  rxdart: ^0.28.0

  # Navigation
  go_router: ^14.0.0

  # Monitoring
  # ^9.x requis : sentry_flutter 8.x ne compile pas avec sentry-cocoa résolu
  # par SPM sous Xcode 26 (SentryBinaryImageCache.image manquant).
  sentry_flutter: ^9.21.0

  # Product analytics + session replay (gestes utilisateur).
  # Init manuelle en Dart (clé via --dart-define) → AUTO_INIT=false côté natif.
  posthog_flutter: ^5.25.2

  # DI
  get_it: ^8.0.0

  # UI / Design
  flutter_animate: ^4.5.0
  flutter_slidable: ^3.1.0
  flutter_svg: ^2.3.0
  # phosphor_flutter retiré : étend IconData (final depuis Flutter 3.44 → erreur
  # de compilation kernel). Les icônes passent par DonyIcons (Material Icons).
  # Voir lib/core/design/dony_icons.dart.
  pinput: ^5.0.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1

  # WebView (Stripe Identity, KYC)
  webview_flutter: ^4.10.0
  # 6.0.2 corrige la course setSize()/onReady de la 5.2.2 (crash JS silencieux
  # dans l'iframe qui bloquait le lecteur en chargement infini) et son bridge
  # JS a désormais un timeout natif de 30 s si le player ne devient jamais Ready.
  youtube_player_iframe: 6.0.2

  # External browser (Stripe Connect onboarding)
  url_launcher: ^6.3.0

  # Réglages système (accessibilité, notifications, etc.)
  app_settings: ^6.1.1

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Splash
  flutter_native_splash: ^2.4.3

  # Deep links
  app_links: ^6.3.4

  # Utils
  package_info_plus: ^8.3.0
  intl: ^0.20.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  share_plus: ^10.0.0
  screen_brightness: ^2.1.0
  uuid: ^4.4.0
  device_info_plus: ^10.1.2
  crypto: ^3.0.6
  path_provider: ^2.1.0
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.2
  flutter_skill: ^0.9.36
  firebase_remote_config: ^6.5.0
  url_launcher_platform_interface: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_driver:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  fake_cloud_firestore: ^4.2.0
  flutter_launcher_icons: ^0.14.0
  path_provider_platform_interface: ^2.1.2

# flutter_stripe 12.6 est requis pour le fix iOS (stripe_ios 12.6 contient la
# résolution de fenêtre via UIScene `connectedScenes` → la PaymentSheet s'ouvre
# sous le SceneDelegate Flutter). MAIS stripe_android 12.2.0+ pose
# @SuppressLint("RestrictedApi") sur une expression, ce que TOUT compilateur
# Kotlin (2.1/2.2/2.3) rejette en erreur dure → :stripe_android:compileDebugKotlin
# échoue. stripe_android 12.1.0 est la dernière version sans ce code. On force
# donc 12.1.0 côté Android uniquement (iOS reste sur stripe_ios 12.6). Le wallet
# n'utilise que initPaymentSheet/presentPaymentSheet, présents en 12.1.0.
dependency_overrides:
  stripe_android: 12.1.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logos/app_icon_source.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logos/app_icon_source.png"
  web:
    generate: true
    image_path: "assets/logos/app_icon_source.png"
    background_color: "#FFFFFF"
    theme_color: "#0B5FFF"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/splash/app_icon_native.png
  android_12:
    color: "#FFFFFF"
    icon_background_color: "#FFFFFF"
    image: assets/splash/app_icon_android12.png
  ios: true
  android: true

flutter:
  config:
    enable-lldb-debugging: false
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/logos/payment/
    - assets/logos/social/
    - assets/mascotte/
    - assets/splash/
    - assets/illustrations/
    - assets/icons/
    - assets/icons_3d/
    - assets/config/help_center_config.default.json
