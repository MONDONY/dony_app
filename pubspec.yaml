name: dony
description: "P2P marketplace connecting travelers and senders for package delivery to Africa."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0

  # Payments
  flutter_stripe: ^11.0.0

  # QR & Biometrics
  mobile_scanner: ^5.0.0
  local_auth: ^2.3.0

  # Location
  geolocator: ^13.0.0

  # Media
  image_picker: ^1.1.0
  native_exif: ^0.7.0

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.0

  # State management
  flutter_bloc: ^8.1.6

  # Navigation
  go_router: ^14.0.0

  # Monitoring
  sentry_flutter: ^8.0.0

  # DI
  get_it: ^8.0.0

  # UI / Design
  flutter_animate: ^4.5.0
  pinput: ^5.0.0
  flutter_secure_storage: ^9.2.2
  google_fonts: ^6.2.1

  # WebView (Stripe Identity)
  webview_flutter: ^4.10.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # Utils
  intl: ^0.20.2
  equatable: ^2.0.7
  json_annotation: ^4.9.0
  share_plus: ^10.0.0
  path_provider: ^2.1.0
  flutter_localizations:
    sdk: flutter
  gal: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  bloc_test: ^9.1.7
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_launcher.png"
  adaptive_icon_background: "#1E88E5"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  web:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/images/
